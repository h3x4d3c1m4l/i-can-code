<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <script>
    /*
      Cross-origin isolation, for a host that cannot send the headers itself.

      First in the document on purpose. The service worker below cannot control
      the page that registered it, so the very first visit reloads once — and
      that reload has to happen before Flutter starts pulling down the engine
      and the 20 MB of Python assets, not after.

      `credentialless` is forced off so the deployed site lands on exactly the
      `require-corp` the dev server already serves. Everything here is bundled
      and same-origin, so the stricter of the two costs nothing, and a
      subresource that breaks in only one of the two environments is the whole
      reason to keep them identical.

      Does nothing when the headers already arrive: the script returns early
      while `crossOriginIsolated` is true, which is every configuration in
      .vscode/launch.json.
    */
    window.coi = { coepCredentialless: () => false, quiet: true };
  </script>
  <script src="coi-serviceworker.js"></script>
  <script>
    /*
      The nudge the script above is missing.

      Its registration callback reloads only when it finds an already-*active*
      worker, and on a first visit the registration resolves while the worker is
      still installing — so it registers, reloads nothing, and the page stays
      un-isolated until someone presses reload by hand. Verified against
      Chrome 153 on a clean profile.

      `serviceWorker.ready` settles once a worker controls this scope, which is
      exactly the moment the check upstream is looking for. The sessionStorage
      flag is what stops a worker that never activates from turning this into a
      reload loop, and storage being refused only costs the reload.
    */
    if (window.crossOriginIsolated === false && 'serviceWorker' in navigator) {
      navigator.serviceWorker.ready.then(function () {
        if (window.crossOriginIsolated) return;
        try {
          if (sessionStorage.getItem('coiReloadedForIsolation')) return;
          sessionStorage.setItem('coiReloadedForIsolation', '1');
        } catch (e) {
          return;
        }
        window.location.reload();
      }).catch(function () {
        /* No worker to wait for. The console screen says why it cannot run. */
      });
    }
  </script>

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="I Can Code — learn to program, in your browser.">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="I Can Code">
  <!--
    The .ico is for browsers without SVG favicons and for anything that asks
    for /favicon.ico by convention. icon.svg is a heavier cut of the mark than
    AppLogo's, because at 16px the regular drawing closes its gaps.
  -->
  <link rel="icon" href="favicon.ico" sizes="32x32">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">

  <script>
    /*
      Picks the splash's mode before the first paint.

      Reads the same key ThemeModeController writes: SharedPreferencesAsync
      stores it in localStorage verbatim — no "flutter." prefix — JSON-encoded,
      so the value is a quoted string. The literal "theme.mode" below MUST be
      changed alongside ThemeModeControllerBase.storageKey.

      Without this the splash would follow the OS, and a student who forced
      light on a dark machine would watch it flash. Storage being refused is not
      an error here: the media query in the stylesheet still applies.
    */
    try {
      var mode = JSON.parse(localStorage.getItem('theme.mode') || '"system"');
      if (mode === 'light' || mode === 'dark') document.documentElement.dataset.theme = mode;
    } catch (e) {
      /* Private mode, or storage disabled. The media query decides. */
    }
  </script>

  <style>
    /*
      Covers the seconds before Flutter exists, so it cannot reach the app's
      theme. These colours restate AppColorPreset.neutral by hand and MUST be
      changed alongside it.
    */
    :root {
      --foreground: #0A0A0A;
      --primary: #FFDC58;
      --primary-foreground: #0A0A0A;
      --page: #FFF4E0;
      --border: rgba(10, 10, 10, 0.15);
      --error: #E11D48;
    }

    /*
      Dark, in the two states that mean it: the OS asks for it and nothing
      overrode it, or the script above stamped it. Both blocks restate the same
      values rather than one @media wrapping the other, because a forced *light*
      on a dark OS has to win.
    */
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --foreground: #EEEFE9;
        --primary: #FFDC58;
        --primary-foreground: #0A0A0A;
        --page: #232332;
        --border: rgba(238, 239, 233, 0.2);
        --error: #FF7A8F;
      }
    }

    :root[data-theme="dark"] {
      --foreground: #EEEFE9;
      --primary: #FFDC58;
      --primary-foreground: #0A0A0A;
      --page: #232332;
      --border: rgba(238, 239, 233, 0.2);
      --error: #FF7A8F;
    }

    body {
      margin: 0;
      background: var(--page);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: var(--foreground);
    }

    #loading-container,
    #error-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      gap: 20px;
      padding: 24px;
      box-sizing: border-box;
      text-align: center;
    }

    #error-container {
      display: none;
    }

    /* The app's mark at the size the initialization screen hands over to. The
       SVG restates AppLogo's drawing and its tile, which is Flutter's
       ContinuousRectangleBorder path, and MUST be changed alongside it. */
    .mark {
      width: 118px;
      height: 118px;
    }

    .mark .tile { fill: var(--primary); }
    .mark .face { stroke: var(--primary-foreground); }

    .mark .eyes {
      transform-box: fill-box;
      transform-origin: center;
      animation: blink 4s infinite;
    }

    @keyframes blink {
      0%, 92%, 100% { transform: scaleY(1); }
      96% { transform: scaleY(0.15); }
    }

    #loading-message,
    #error-message {
      margin: 0;
      font-size: 17px;
      font-weight: 600;
    }

    #error-message {
      color: var(--error);
    }

    /*
      One ring, two states. Without `aria-valuenow` it is a quarter arc that
      turns. With one, the script below sets the arc's length and the ring
      stands still and fills. 94.25 is the circumference at r = 15.
    */
    .ring {
      width: 34px;
      height: 34px;
    }

    .ring circle {
      fill: none;
      stroke-width: 4;
    }

    .ring .track { stroke: var(--border); }

    .ring .value {
      stroke: var(--primary);
      stroke-dasharray: 23.56 94.25;
      /* An arc is drawn from three o'clock. This starts it at the top. */
      transform: rotate(-90deg);
      transform-origin: center;
    }

    .ring:not([aria-valuenow]) {
      animation: spin 1s linear infinite;
    }

    .ring[aria-valuenow] .value {
      transition: stroke-dasharray 150ms linear;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* A pulse says as much as a spin, without the vestibular trigger. */
    @media (prefers-reduced-motion: reduce) {
      .ring:not([aria-valuenow]) { animation: none; opacity: 0.5; }
      .ring[aria-valuenow] .value { transition: none; }
      .mark .eyes { animation: none; }
    }

    #retry-button {
      padding: 14px 30px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      border: 0;
      border-radius: 21px;
      background: var(--primary);
      color: var(--primary-foreground);
    }

    #retry-button:hover {
      opacity: 0.85;
    }
  </style>

  <title>I Can Code</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <div id="loading-container">
    <svg class="mark" viewBox="0 0 256 256" aria-hidden="true">
      <path class="tile" d="M0 128C0 0 0 0 128 0C256 0 256 0 256 128C256 256 256 256 128 256C0 256 0 256 0 128Z"/>
      <g class="face" fill="none" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"
         transform="translate(128 128) scale(0.66) translate(-128 -128)">
        <path class="eyes" d="M44 109L76 77L108 109M148 109L180 77L212 109"/>
        <path d="M72 153Q128 205 184 153"/>
      </g>
    </svg>
    <svg id="loading-ring" class="ring" viewBox="0 0 34 34" role="progressbar" aria-label="Loading">
      <circle class="track" cx="17" cy="17" r="15"/>
      <circle class="value" cx="17" cy="17" r="15"/>
    </svg>
    <p id="loading-message">Loading…</p>
  </div>
  <div id="error-container">
    <svg class="mark" viewBox="0 0 256 256" aria-hidden="true">
      <path class="tile" d="M0 128C0 0 0 0 128 0C256 0 256 0 256 128C256 256 256 256 128 256C0 256 0 256 0 128Z"/>
      <g class="face" fill="none" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"
         transform="translate(128 128) scale(0.66) translate(-128 -128)">
        <path class="eyes" d="M44 109L76 77L108 109M148 109L180 77L212 109"/>
        <path d="M72 153Q128 205 184 153"/>
      </g>
    </svg>
    <p id="error-message">I Can Code could not be loaded.</p>
    <button id="retry-button" onclick="window.location.reload()">Try again</button>
  </div>
  <script>
    /*
      Download progress, for the ring above and for the initialization screen.

      Flutter reports nothing about what it downloads, so this counts it: a
      wrapper around `window.fetch` reads a copy of every response it knows the
      size of, and the ring shows the share that has arrived. The response the
      caller gets is the original, untouched.

      What it leans on, and what happens without each:

       * The loader and the engine download CanvasKit, the fonts and the assets
         through `window.fetch`. tool/finish_web_build.dart fails the build when
         main.dart.js stops doing so.
       * The sizes are written over the `null` below by that same tool. Without
         them, which is every `flutter run`, nothing is wrapped and the ring
         turns as a spinner.
       * A script tag is not a fetch. See where main.dart.js is loaded, below.

      `Content-Length` cannot stand in for the sizes: a host that compresses
      reports the compressed length, while a body arrives decompressed.

      Each size is `[bytes, bytes gzipped]`. Bytes are what can be counted as
      they arrive, and gzipped bytes are what the download costs, so a file
      weighs its gzipped size in the total.
    */
    (function () {
      const sizes = /*STARTUP_SIZES*/null;
      if (!sizes) return;

      const files = sizes.files;
      const canvasKit = sizes.canvasKit;
      const base = new URL(document.baseURI);

      // Only one CanvasKit is downloaded, and the loader picks it. This is a
      // guess at its pick, replaced by the one that is actually asked for.
      let variant = 'v8BreakIterator' in Intl ? 'canvaskit/chromium/canvaskit.wasm' : 'canvaskit/canvaskit.wasm';
      if (!canvasKit[variant]) variant = Object.keys(canvasKit)[0];

      const arrived = new Map();
      const underway = new Map();
      let shown = 0;
      let scheduled = false;

      function sizeOf(path) {
        return files[path] || canvasKit[path];
      }

      function fraction() {
        let total = 0;
        let done = 0;
        for (const path of Object.keys(files).concat(variant)) {
          const [bytes, gzipped] = sizeOf(path);
          total += gzipped;
          done += gzipped * (bytes ? Math.min(1, (arrived.get(path) || 0) / bytes) : 1);
        }
        // Never backwards: a different CanvasKit than guessed changes the total.
        shown = Math.max(shown, total ? done / total : 0);
        return shown;
      }

      function draw() {
        scheduled = false;
        const value = fraction();
        const ring = document.getElementById('loading-ring');
        if (ring) {
          ring.setAttribute('aria-valuenow', Math.round(value * 100));
          ring.querySelector('.value').style.strokeDasharray = (value * 94.25) + ' 94.25';
        }
        window.dispatchEvent(new CustomEvent('icc-startup-progress'));
      }

      function changed() {
        if (scheduled) return;
        scheduled = true;
        requestAnimationFrame(draw);
      }

      // The path a request names under the page's base, or null for anywhere else.
      function pathOf(input) {
        try {
          const url = new URL(input instanceof Request ? input.url : String(input), base);
          if (url.origin !== base.origin || !url.pathname.startsWith(base.pathname)) return null;
          return decodeURIComponent(url.pathname.substring(base.pathname.length));
        } catch (e) {
          return null;
        }
      }

      // Reads a copy of `response` to its end, counting. The promise it returns
      // settles when the file is in, or has failed, and never rejects.
      function count(path, response) {
        if (!response.ok || !response.body) {
          arrived.delete(path);
          return Promise.resolve();
        }
        const reader = response.clone().body.getReader();
        return (function next() {
          return reader.read().then(function (chunk) {
            if (chunk.done) {
              arrived.set(path, sizeOf(path)[0]);
              changed();
              return;
            }
            arrived.set(path, arrived.get(path) + chunk.value.byteLength);
            changed();
            return next();
          });
        })().catch(function () {
          // Forgotten, so that a retry of this file is counted again.
          arrived.delete(path);
        });
      }

      const fetchUncounted = window.fetch;
      window.fetch = function (input, init) {
        const request = arguments;
        const method = (init && init.method) || (input instanceof Request ? input.method : 'GET');
        const path = method === 'GET' ? pathOf(input) : null;
        if (path === null || !sizeOf(path)) return fetchUncounted.apply(window, request);

        // A file still on its way is waited for, and only then asked for again,
        // so the second request is answered from the HTTP cache. One font is
        // bundled under two families, and the engine fetches it once for each
        // at the same moment, which the browser does not combine by itself.
        if (underway.has(path)) {
          return underway.get(path).then(function () { return fetchUncounted.apply(window, request); });
        }
        // Counted once already.
        if (arrived.has(path)) return fetchUncounted.apply(window, request);

        arrived.set(path, 0);
        if (canvasKit[path]) variant = path;
        const response = fetchUncounted.apply(window, request);
        // Attached before the caller can attach anything, so the copy is taken
        // before the caller starts reading the body.
        underway.set(path, response.then(
          function (answer) { return count(path, answer); },
          function () { arrived.delete(path); },
        ).then(function () { underway.delete(path); }));
        return response;
      };

      // The initialization screen reads this, and listens for the event `draw`
      // sends, to carry the same ring on once the splash is gone.
      window.iccStartup = {
        get fraction() { return fraction(); },
      };

      draw();
    })();
  </script>
  <script>
    {{flutter_js}}
    {{flutter_build_config}}

    // Adapted from https://docs.flutter.dev/platform-integration/web/initialization
    const loadingContainer = document.getElementById('loading-container');
    const loadingMessage = document.getElementById('loading-message');
    const errorContainer = document.getElementById('error-container');

    function showError() {
      loadingContainer.remove();
      errorContainer.style.display = 'flex';
    }

    function start() {
      _flutter.loader.load({
        onEntrypointLoaded: async function (engineInitializer) {
          try {
            loadingMessage.textContent = 'Starting the engine…';
            const appRunner = await engineInitializer.initializeEngine();

            loadingMessage.textContent = 'Starting the app…';
            await appRunner.runApp();

            loadingContainer.remove();
          } catch (e) {
            showError();
          }
        }
      });
    }

    /*
      The loader adds main.dart.js as a script tag, and a script tag reports
      nothing while it downloads. So where progress is counted, the file is
      fetched here first and the loader's tag is then answered from the HTTP
      cache.

      Not a blob URL, which the loader would also take: a blob has a new URL on
      every visit, so the browser could never reuse the code it compiled for
      the last one. And a host that forbids caching costs a second download
      this way, where a blob the loader stopped accepting would cost the start.

      CanvasKit starts downloading in `load()`, so it now follows main.dart.js
      instead of running beside it.
    */
    if (window.iccStartup) {
      fetch('main.dart.js')
        .then(function (response) { return response.arrayBuffer(); })
        .catch(function () { /* The loader's own attempt reports the failure. */ })
        .then(start);
    } else {
      start();
    }
  </script>
</body>
</html>
