[package]
name = "icc-vm-agent"
version = "0.1.0"
edition = "2024"
# Alpine 3.22's rust package, which the image build compiles this with. Resolver
# 3 reads it when the lock is generated, so Cargo.lock only holds versions that
# build there.
rust-version = "1.87"
publish = false

[[bin]]
name = "icc-agent"
path = "src/main.rs"

[dependencies]
crc32fast = "1.4"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
x11rb = { version = "0.14.0", default-features = false }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
