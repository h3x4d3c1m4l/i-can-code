# bochs-drm binds v86's VGA (PCI 1234:1111) and exposes /dev/fb0 through fbdev emulation, in
# the mode video= on the kernel command line asks for. fbdev cannot change that mode, so the
# screen size is set there and nowhere else.
Section "Device"
    Identifier "v86-fb"
    Driver     "fbdev"
    Option     "fbdev" "/dev/fb0"
EndSection

# A page can leave the machine parked or hidden for a long time, and nothing the student does
# reaches X meanwhile. Blanking or DPMS would then greet the next run with a black screen.
Section "Monitor"
    Identifier "v86-monitor"
    Option     "DPMS" "false"
EndSection

Section "Screen"
    Identifier   "v86-screen"
    Device       "v86-fb"
    Monitor      "v86-monitor"
    DefaultDepth 24
EndSection

# Alpine runs mdev, not udev, so Xorg's hotplug finds no input devices at all. These are the
# ones v86 provides, under the names /usr/lib/icc/mdev-input gives them. The keymap is US only.
Section "InputDevice"
    Identifier "keyboard"
    Driver     "evdev"
    Option     "Device" "/dev/input/icc-keyboard"
    Option     "XkbLayout" "us"
EndSection

# v86's VMware absolute mouse, so a click lands where the host drew the pointer.
Section "InputDevice"
    Identifier "pointer"
    Driver     "evdev"
    Option     "Device" "/dev/input/icc-pointer"
EndSection

Section "InputDevice"
    Identifier "wheel"
    Driver     "evdev"
    Option     "Device" "/dev/input/icc-wheel"
EndSection

Section "ServerLayout"
    Identifier  "v86"
    Screen      "v86-screen"
    InputDevice "keyboard" "CoreKeyboard"
    InputDevice "pointer" "CorePointer"
    InputDevice "wheel" "SendCoreEvents"
EndSection

# Every key reaches the student's program, so the chords that would switch the console away
# from X or kill the server are off.
Section "ServerFlags"
    Option "AutoAddDevices" "false"
    Option "AutoAddGPU"     "false"
    Option "DontVTSwitch"   "true"
    Option "DontZap"        "true"
    Option "BlankTime"      "0"
    Option "StandbyTime"    "0"
    Option "SuspendTime"    "0"
    Option "OffTime"        "0"
EndSection

# Mesa's GL stack is stripped from the image, so the modules that need it stay unloaded.
Section "Module"
    Disable "glx"
    Disable "glamoregl"
EndSection
