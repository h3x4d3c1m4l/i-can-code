# Alt+SysRq is a chord a student can type into the display, and SysRq+B reboots the machine.
kernel.sysrq = 0

# The kernel raises its free-memory watermarks for a while after a fragmentation event, so PREPARE's
# zero-fill, which stops 2 MiB above zero free, sometimes ran into reclaim and dropped the warm
# interpreter's mapped pages before the snapshot. Nothing here needs large contiguous pages.
vm.watermark_boost_factor = 0
