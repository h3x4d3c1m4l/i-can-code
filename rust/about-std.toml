# What `cargo about` collects for the standard library, which `-Z build-std`
# compiles into the wasm beside the crates of about.toml. Run against the
# library's own manifest in the pinned toolchain; see docs/licenses.md.

# A priority list, as in about.toml. `compiler_builtins` carries code ported
# from LLVM's compiler-rt, which is where the exception comes from.
accepted = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "Unicode-3.0"]

targets = ["wasm32-unknown-unknown"]

ignore-build-dependencies = true
ignore-dev-dependencies = true
