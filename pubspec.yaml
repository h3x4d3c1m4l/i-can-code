name: i_can_code
description: "I Can Code - learn to code, in the browser."
publish_to: 'none'

version: 0.2.0+1

environment:
  # The package's *language version*, which is what the compiler allows generated
  # code to use. freezed and theme_tailor both floor at 3.13.0.
  sdk: ^3.13.0

dependencies:
  flutter: { sdk: flutter }
  flutter_localizations: { sdk: flutter }
  # Not used by this app's own code. forui's FTextField reaches for Cupertino's
  # text-selection toolbar and magnifier on Apple platforms, and without this the
  # glyphs it names have no font — a missing box in the selection toolbar on iOS
  # Safari, and a build warning on every `flutter build web`. Tree-shaken to a
  # few bytes, since only those glyphs are referenced.
  cupertino_icons: ^1.0.8
  intl: any

  forui: 0.27.0
  mobx: 2.7.0
  flutter_mobx: 2.4.0
  auto_route: 11.2.0
  get_it: 9.3.0
  google_fonts: 8.2.1
  flutter_markdown_plus: 1.0.12
  flutter_confetti: 0.9.2
  re_editor: 0.10.0
  re_highlight: 0.0.3
  markdown: 7.3.1
  shared_preferences: 2.5.5
  package_info_plus: 10.2.1
  yaml: 3.1.4
  freezed_annotation: 3.1.0
  meta: 1.19.0
  web: 1.1.1
  material_ui: 1.4.0
  theme_tailor_annotation: 4.0.0
  xterm: 4.0.0
  flutter_rust_bridge: 2.13.0

dev_dependencies:
  shared_preferences_platform_interface: 2.4.2
  flutter_test: { sdk: flutter }

  flutter_lints: ^6.0.0
  build_runner: 2.16.1
  mobx_codegen: 2.8.0
  auto_route_generator: 10.6.0
  freezed: 4.0.1
  json_serializable: 6.14.1
  theme_tailor: 4.0.1

flutter:
  uses-material-design: true
  generate: true

  assets:
    # CPython 3.14 built for wasm32-wasi plus its stdlib; see docs/python-wasm-build.md.
    - assets/python/python.wasm
    - assets/python/python314.zip
    # Flutter's asset globbing is NOT recursive: every directory must be listed.
    - assets/lessons/
    - assets/lessons/python/
    # The MicroPython hex a flashed program is built into. Fetched rather than
    # committed, so this directory holds only a README until `just
    # fetch-microbit-firmware` has run; see docs/rust-core-build.md.
    - assets/microbit/

  fonts:
    - family: Fredoka
      fonts:
        - asset: assets/fonts/Fredoka-400.ttf
          weight: 400
        - asset: assets/fonts/Fredoka-500.ttf
          weight: 500
        - asset: assets/fonts/Fredoka-600.ttf
          weight: 600
        - asset: assets/fonts/Fredoka-700.ttf
          weight: 700
    - family: Lexend
      fonts:
        - asset: assets/fonts/Lexend-400.ttf
          weight: 400
        - asset: assets/fonts/Lexend-500.ttf
          weight: 500
        - asset: assets/fonts/Lexend-600.ttf
          weight: 600
        - asset: assets/fonts/Lexend-700.ttf
          weight: 700
        - asset: assets/fonts/Lexend-800.ttf
          weight: 800
    - family: Noto Color Emoji
      fonts:
        - asset: assets/fonts/NotoColorEmoji.ttf
    - family: JetBrains Mono
      fonts:
        - asset: assets/fonts/JetBrainsMono-400.ttf
          weight: 400
        - asset: assets/fonts/JetBrainsMono-500.ttf
          weight: 500
