name: i_can_code
description: "I Can Code - learn to code, in the browser."
publish_to: 'none'

version: 0.8.1+1

environment:
  # The package's *language version*, which is what the compiler allows generated
  # code to use. freezed and theme_tailor both floor at 3.13.0.
  sdk: ^3.13.0

dependencies:
  flutter: { sdk: flutter }
  flutter_localizations: { sdk: flutter }
  # Not used by this app's own code. forui's FTextField reaches for Cupertino's
  # text-selection toolbar and magnifier on Apple platforms, and without this the
  # glyphs it names have no font — a missing box in the selection toolbar on iOS
  # Safari, and a build warning on every `flutter build web`. Tree-shaken to a
  # few bytes, since only those glyphs are referenced.
  cupertino_icons: ^2.0.0
  intl: any

  forui: 0.27.4
  mobx: 2.7.0
  flutter_mobx: 2.4.0
  auto_route: 11.2.0
  get_it: 9.3.0
  flutter_markdown_plus: 1.0.12
  flutter_confetti: 0.9.2
  re_editor: 0.10.0
  re_highlight: 0.0.3
  markdown: 7.3.1
  shared_preferences: 2.5.6
  package_info_plus: 10.2.2
  yaml: 3.1.4
  freezed_annotation: 3.1.0
  meta: 1.19.0
  web: 1.1.1
  material_ui: 1.6.0
  theme_tailor_annotation: 4.0.0
  xterm: 4.0.0
  flutter_rust_bridge: 2.13.0
  url_launcher: 6.3.3

dev_dependencies:
  shared_preferences_platform_interface: 2.4.2
  url_launcher_platform_interface: 2.3.2
  flutter_test: { sdk: flutter }

  flutter_lints: ^6.0.0
  build_runner: 2.16.1
  mobx_codegen: 2.8.0
  auto_route_generator: 10.6.0
  freezed: 4.0.1
  json_serializable: 6.14.1
  theme_tailor: 4.0.1

flutter:
  uses-material-design: true
  generate: true

  assets:
    # CPython 3.14 built for wasm32-wasi plus its stdlib; see docs/python-wasm-build.md.
    - assets/python/python.wasm
    - assets/python/python314.zip
    # Every lesson under assets/lessons/, in one file, so a cold start fetches
    # the course in one request. The committed file is a placeholder: the
    # transformer (bin/bundle_lessons.dart) writes the real one during the build.
    - path: assets/course.json
      transformers:
        - package: i_can_code:bundle_lessons

    # Flutter's asset globbing is NOT recursive: every directory below must be
    # listed.
    #
    # The MicroPython hex a flashed program is built into. Fetched rather than
    # committed, so this directory holds only a README until `just
    # fetch-microbit-firmware` has run; see docs/rust-core-build.md.
    - assets/microbit/

    # Licence texts for what Flutter's own NOTICES does not cover, read by the
    # licence screen. Listed in `kBundledLicenses`; see docs/licenses.md.
    - assets/licenses/
    - assets/python/licenses/
    - assets/microbit/licenses/
    - assets/fonts/OFL-Fredoka.txt
    - assets/fonts/OFL-Lexend.txt
    - assets/fonts/OFL-JetBrainsMono.txt
    - assets/fonts/OFL-NotoColorEmoji.txt

  fonts:
    # Variable fonts, one file per family: a `FontWeight` sets the `wght` axis.
    # Neither entry states a weight, because a weight here would pin the file
    # to that one. Fredoka's own default is 300, and no style asks for it.
    - family: Fredoka
      fonts:
        - asset: assets/fonts/Fredoka-Variable.ttf
    - family: Lexend
      fonts:
        - asset: assets/fonts/Lexend-Variable.ttf
    # Not a font the app draws with. Flutter's web engine downloads Roboto from
    # fonts.gstatic.com unless a family of that name is bundled, and uses it for
    # text that names no family. This points that name at the body face.
    - family: Roboto
      fonts:
        - asset: assets/fonts/Lexend-Variable.ttf
    - family: Noto Color Emoji
      fonts:
        - asset: assets/fonts/NotoColorEmoji.ttf
    - family: JetBrains Mono NL
      fonts:
        - asset: assets/fonts/JetBrainsMonoNL-400.ttf
          weight: 400
        - asset: assets/fonts/JetBrainsMonoNL-500.ttf
          weight: 500
