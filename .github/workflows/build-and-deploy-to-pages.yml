name: Build and deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    name: Build

    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Verify LFS assets were fetched
        run: |
          magic=$(head -c 4 assets/python/python.wasm | xxd -p)
          if [ "$magic" != "0061736d" ]; then
            echo "::error title=Git LFS assets missing::assets/python/python.wasm starts with $magic, not the wasm magic word 0061736d. Checkout probably left an LFS pointer."
            exit 1
          fi

      - name: Detect Flutter version
        uses: kuhnroyal/flutter-fvm-config-action@v3

      - name: Setup Flutter
        uses: flutter-actions/setup-flutter@v4
        with:
          channel: stable
          version: ${{ env.FLUTTER_VERSION }}
          cache: true
          cache-sdk: true

      - name: Disable Flutter analytics and CLI animations
        run: flutter config --no-analytics --no-cli-animations

      - name: Flutter SDK precache
        run: flutter precache --web

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      # `rust-toolchain.toml` pins the nightly the wasm build uses, so rustup
      # installs it, its `rust-src` and the wasm target by itself once cargo runs
      # inside `rust/`.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install the pinned nightly
        run: cd rust && rustup show

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target

      - name: Install just
        uses: extractions/setup-just@v3

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@main

      # Prebuilt binaries. Compiling wasm-bindgen-cli from source takes minutes,
      # and wasm-pack installing it on demand inherits whatever RUSTFLAGS are set,
      # which fails on `'+atomics' is not a recognized feature for this target`.
      #
      # cargo-expand is what the codegen shells out to when it has to expand a
      # macro to see a type.
      - name: Install the wasm toolchain
        run: |
          version=$(awk '/^  flutter_rust_bridge:/{f=1} f&&/^    version:/{gsub(/"/,"",$2); print $2; exit}' pubspec.lock)
          cargo binstall --force -y \
            cargo-expand \
            wasm-pack \
            wasm-bindgen-cli \
            "flutter_rust_bridge_codegen@$version"

      # Writes lib/src/rust/, rust/src/frb_generated.rs and web/pkg/, none of
      # which are committed. MUST come before the checks below: `lib.rs` declares
      # `mod frb_generated`, so the crate does not compile until this has run.
      - name: Build the Rust core
        run: just build-rust-core

      # Stable, not the pinned nightly: only the wasm build needs that, and the
      # crate's own source has to stay stable-clean.
      - name: Rust format
        run: cd rust && cargo +stable fmt --check

      - name: Rust clippy
        run: cd rust && cargo +stable clippy --all-targets -- -D warnings

      - name: Rust test
        run: cd rust && cargo +stable test

      - name: Run code generation
        run: dart run build_runner build

      # `generate: true` only regenerates l10n on `flutter build` / `flutter run`,
      # so analyze and test would otherwise run against a missing
      # `lib/l10n/generated/` on a clean checkout.
      - name: Generate localizations
        run: flutter gen-l10n

      - name: Flutter analyze
        run: flutter analyze

      # Not optional: `dart analyze` stays green while every build and test
      # fails when a generator emits syntax the language version rejects.
      - name: Flutter test
        run: flutter test

      # The site is served from https://<owner>.github.io/i-can-code/, so every
      # asset URL has to be rooted there rather than at `/`.
      #
      # No `--wasm`: dart2wasm rejects `dart:html`, which reaches this app
      # through re_editor -> isolate_manager -> isolate_contactor. Add it back
      # once that chain is off `dart:html`.
      - name: Build web
        run: flutter build web --release --base-href '/i-can-code/'

      - name: Fix permissions
        run: |
          chmod -c -R +rX "build/web/" | while read line; do
            echo "::warning title=Invalid file permissions automatically fixed::$line"
          done

      - name: Upload artifact for Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: 'build/web'

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-24.04

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
