name: PR CI

on:
  pull_request:
    branches: [ main ]
    paths-ignore: [ README.md ]
    types: [ opened, synchronize, reopened, ready_for_review ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build

    if: ${{ github.event.pull_request.draft != true }}

    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Verify LFS assets were fetched
        run: |
          magic=$(head -c 4 assets/python/python.wasm | xxd -p)
          if [ "$magic" != "0061736d" ]; then
            echo "::error title=Git LFS assets missing::assets/python/python.wasm starts with $magic, not the wasm magic word 0061736d. Checkout probably left an LFS pointer."
            exit 1
          fi

      - name: Detect Flutter version
        uses: kuhnroyal/flutter-fvm-config-action@v3

      - name: Setup Flutter
        uses: flutter-actions/setup-flutter@v4
        with:
          channel: stable
          version: ${{ env.FLUTTER_VERSION }}
          cache: true
          cache-sdk: true

      - name: Disable Flutter analytics and CLI animations
        run: flutter config --no-analytics --no-cli-animations

      - name: Flutter SDK precache
        run: flutter precache --web

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      # `rust-toolchain.toml` pins the nightly the wasm build uses, so rustup
      # installs it, its `rust-src` and the wasm target by itself once cargo runs
      # inside `rust/`.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install the pinned nightly
        run: cd rust && rustup show

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            rust -> target
            vm/agent -> target

      - name: Install just
        uses: extractions/setup-just@v4

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@main

      # Prebuilt binaries. Compiling wasm-bindgen-cli from source takes minutes,
      # and wasm-pack installing it on demand inherits whatever RUSTFLAGS are set,
      # which fails on `'+atomics' is not a recognized feature for this target`.
      #
      # wasm-bindgen-cli MUST be the version rust/Cargo.lock resolves the
      # wasm-bindgen crate to. On any other, wasm-pack installs its own, which
      # is that same failure.
      #
      # cargo-expand is what the codegen shells out to when it has to expand a
      # macro to see a type.
      #
      # cargo-about collects the crates' licence texts. Its version is the
      # justfile's, which is the one `gen-rust-licenses` insists on.
      - name: Install the wasm toolchain
        run: |
          version=$(awk '/^  flutter_rust_bridge:/{f=1} f&&/^    version:/{gsub(/"/,"",$2); print $2; exit}' pubspec.lock)
          bindgen=$(awk '/^name = "wasm-bindgen"$/{f=1;next} f&&/^version/{gsub(/"/,"",$3); print $3; exit}' rust/Cargo.lock)
          about=$(just --evaluate cargo_about_version)
          cargo binstall --force -y \
            cargo-expand \
            wasm-pack \
            "wasm-bindgen-cli@$bindgen" \
            "flutter_rust_bridge_codegen@$version" \
            "cargo-about@$about"

      # The hex the flasher builds on. Not committed; the tests that need it
      # skip without it, which would make them worthless here.
      - name: Fetch the micro:bit firmware
        run: just fetch-microbit-firmware

      # Writes lib/src/rust/, rust/src/frb_generated.rs and web/pkg/, none of
      # which are committed. MUST come before the checks below: `lib.rs` declares
      # `mod frb_generated`, so the crate does not compile until this has run.
      - name: Build the Rust core
        run: just build-rust-core

      # Stable, not the pinned nightly: only the wasm build needs that, and the
      # crate's own source has to stay stable-clean.
      - name: Rust format
        run: cd rust && cargo +stable fmt --check

      - name: Rust clippy
        run: cd rust && cargo +stable clippy --all-targets -- -D warnings

      - name: Rust test
        run: cd rust && cargo +stable test

      # The licence screen reads these from the repository, so a dependency
      # that changed without them is a licence nobody is shown. Regenerates
      # them and fails on a difference; see docs/licenses.md.
      - name: Check the Rust licence texts
        run: just check-rust-licenses

      # The Tkinter VM's guest agent, on stable like the crate above: its
      # `rust-version` (1.87) is the floor clippy holds it to, under whatever Rust
      # the pinned Alpine builds it with inside the image. The image build itself
      # stays local.
      - name: VM agent format
        run: cd vm/agent && cargo +stable fmt --check

      - name: VM agent clippy
        run: cd vm/agent && cargo +stable clippy --all-targets --locked -- -D warnings

      # The guest is i386 musl, whose libc deprecates what the runner's does not
      # (`time_t`), so the agent is linted for it as well.
      - name: VM agent clippy for the guest
        run: |
          rustup +stable target add i686-unknown-linux-musl
          cd vm/agent && cargo +stable clippy --all-targets --locked --target i686-unknown-linux-musl -- -D warnings

      - name: VM agent test
        run: cd vm/agent && cargo +stable test --locked

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: vm/tools/package-lock.json

      # `ci` rather than the recipes' `install`: a lockfile out of step with
      # package.json fails here instead of being rewritten. Only v86 is needed,
      # for its wasm; the bench's puppeteer is a dev dependency.
      - name: Install the VM tools
        run: npm ci --prefix vm/tools --omit=dev --no-audit --no-fund

      # The JS codec against the fixtures the agent is held to above, and the
      # host, its run layer, the bundle loader and the screen against a fake v86,
      # agent and DOM. Everything under vm/tools/test; no image needed.
      - name: VM host test
        run: node --test vm/tools/test/*.test.mjs

      - name: Run code generation
        run: dart run build_runner build

      # `generate: true` only regenerates l10n on `flutter build` / `flutter run`,
      # so analyze and test would otherwise run against a missing
      # `lib/l10n/generated/` on a clean checkout.
      - name: Generate localizations
        run: flutter gen-l10n

      - name: Flutter analyze
        run: flutter analyze

      # Not optional: `dart analyze` stays green while every build and test
      # fails when a generator emits syntax the language version rejects.
      - name: Flutter test
        run: flutter test

      # web/vm/image/ is not committed: the image is a release asset, which
      # vm/image.lock pins by URL and sha256 (docs/vm-build.md, "Publishing the
      # image"). The fetch refuses an asset that does not match the pin. Without
      # a pin the build leaves the Tkinter page out, rather than shipping a page
      # whose every load fails.
      - name: Fetch the VM image
        id: vm-image
        run: |
          if [ -f vm/image.lock ]; then
            just fetch-vm-image
            echo "define=--dart-define=ICC_VM_IMAGE=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=No VM image pinned::vm/image.lock does not exist, so this build leaves the Tkinter page out."
          fi

      # A stale image still loads, since the fetch refused one whose protocol
      # differs, but it is not what this commit's sources build.
      - name: Check the VM image pin
        if: hashFiles('vm/image.lock') != ''
        run: |
          just check-vm-image-pin || echo "::warning title=Stale VM image::vm/image.lock was built from other sources than this commit. Rebuild and publish it (docs/vm-build.md, \"Publishing the image\")."

      # Same flags as the deploy, so a PR builds exactly what main will.
      # No `--wasm`: dart2wasm rejects `dart:html`, which reaches this app
      # through re_editor -> isolate_manager -> isolate_contactor. Add it back
      # once that chain is off `dart:html`.
      #
      # `--no-web-resources-cdn` bundles CanvasKit, which the build otherwise
      # points at www.gstatic.com.
      - name: Build web
        run: flutter build web --release --no-web-resources-cdn --base-href '/i-can-code/' ${{ steps.vm-image.outputs.define }}

      # Takes the font forui bundles and nothing draws with out of the build,
      # and writes the sizes the page's progress ring measures against into
      # index.html. Fails when the build is not what the ring was written for.
      - name: Finish web build
        run: dart run tool/finish_web_build.dart build/web
